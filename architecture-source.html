<body>
<style>
  :root {
    --paper:#f2f5f8; --surface:#ffffff; --sunk:#e6edf4;
    --ink:#141a20; --slate:#45505d; --faint:#5a6673;
    --hairline:#cfdae6;
    --steel:#2b6ea8; --steel-fill:#dceaf6; --steel-edge:#7ba9cd;
    --ochre:#b26a08; --ochre-fill:#fbecd4; --ochre-edge:#e0b169;
    --stage-1:#eef3f8; --stage-2:#e0e9f2; --stage-3:#d3dfea;
    --stage-glow1:rgba(120,170,215,.30); --stage-glow2:rgba(190,150,110,.20);
    --stage-edge:#c2d1e0; --stage-shadow:rgba(30,50,70,.16);
    --slab-steel-a:#3d86c6; --slab-steel-b:#1e5687; --slab-steel-top:#6fb2e6;
    --slab-ochre-a:#cf8f2a; --slab-ochre-b:#95600d; --slab-ochre-top:#eab765;
    --slab-neutral-a:#5d7086; --slab-neutral-b:#3a4a5e; --slab-neutral-top:#93aac0;
    --slab-human-a:#3f8f6e; --slab-human-b:#1f6249; --slab-human-top:#6ec49c;
    --slab-ink:#ffffff; --slab-sub:#eef5fb; --slab-tool:#d3e4f2;
    --lbl-steel:#1c5a8c; --lbl-ochre:#845206; --lbl-edge:#48596b;
    --built:#2f6b4f; --partial:#8a6a17; --planned:#6b7280;
    --sel:#1f7a4d; --sel-fill:#d8eee1;
    --and:#4f9a72; --and-fill:#edf7f1;
    --or:#54549e;  --or-fill:#ecedf8;
    --arr-steel:#14496f; --arr-ochre:#8a4f06; --arr-human:#155c41; --arr-neutral:#3d4c5c;
    --acc-leg:#2f6b4f; --acc-mod:#2b6ea8; --acc-rap:#b0691a; --acc-cat:#5a4fa8; --acc-pack:#1d7f74;
    --acc-find:#a3701a; --acc-reg:#a34a4a; --acc-modpanel:#a5327d;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0d1319; --surface:#1a232e; --sunk:#151f2a;
    --ink:#e9eef3; --slate:#b6c2ce; --faint:#9aa8b6;
    --hairline:#31404f;
    --steel:#7cbdec; --steel-fill:#16283a; --steel-edge:#2f5f8a;
    --ochre:#e6ac4e; --ochre-fill:#2c2416; --ochre-edge:#7a5c22;
    --built:#6fb98f; --partial:#d4ab4a; --planned:#8b95a1;
    --sel:#6cc08c; --sel-fill:#1b2f24;
    --and:#8fd0a8; --and-fill:#16241b;
    --or:#9a9ae0;  --or-fill:#1f2030;
    --stage-1:#1c2a39; --stage-2:#111b25; --stage-3:#0a1219;
    --stage-glow1:rgba(60,110,160,.32); --stage-glow2:rgba(120,80,140,.22);
    --stage-edge:#25394d; --stage-shadow:rgba(0,0,0,.75);
    --slab-steel-a:#3f8fd0; --slab-steel-b:#1f5c8f; --slab-steel-top:#7ec0f0;
    --slab-ochre-a:#e0a13d; --slab-ochre-b:#a86c11; --slab-ochre-top:#f5cc85;
    --slab-neutral-a:#5b6e82; --slab-neutral-b:#36455a; --slab-neutral-top:#a8bed3;
    --slab-human-a:#3f9b76; --slab-human-b:#22664c; --slab-human-top:#7fd4ab;
    --slab-ink:#ffffff; --slab-sub:#e8f1f8; --slab-tool:#c6d9e8;
    --lbl-steel:#8ac6f2; --lbl-ochre:#f3c67e; --lbl-edge:#a9c0d4;
    --arr-steel:#9fd4fb; --arr-ochre:#f7cd8a; --arr-human:#93e0bb; --arr-neutral:#c2d4e4;
    --acc-leg:#6fb98f; --acc-mod:#6fb2e6; --acc-rap:#eab765; --acc-cat:#9a90e8; --acc-pack:#5fc4b6;
    --acc-find:#e0b155; --acc-reg:#e08b8b; --acc-modpanel:#f58ccb;
  }}
  :root[data-theme="dark"]{
    --paper:#0d1319; --surface:#1a232e; --sunk:#151f2a;
    --ink:#e9eef3; --slate:#b6c2ce; --faint:#9aa8b6;
    --hairline:#31404f;
    --steel:#7cbdec; --steel-fill:#16283a; --steel-edge:#2f5f8a;
    --ochre:#e6ac4e; --ochre-fill:#2c2416; --ochre-edge:#7a5c22;
    --built:#6fb98f; --partial:#d4ab4a; --planned:#8b95a1;
    --sel:#6cc08c; --sel-fill:#1b2f24;
    --and:#8fd0a8; --and-fill:#16241b;
    --or:#9a9ae0;  --or-fill:#1f2030;
    --stage-1:#1c2a39; --stage-2:#111b25; --stage-3:#0a1219;
    --stage-glow1:rgba(60,110,160,.32); --stage-glow2:rgba(120,80,140,.22);
    --stage-edge:#25394d; --stage-shadow:rgba(0,0,0,.75);
    --slab-steel-a:#3f8fd0; --slab-steel-b:#1f5c8f; --slab-steel-top:#7ec0f0;
    --slab-ochre-a:#e0a13d; --slab-ochre-b:#a86c11; --slab-ochre-top:#f5cc85;
    --slab-neutral-a:#5b6e82; --slab-neutral-b:#36455a; --slab-neutral-top:#a8bed3;
    --slab-human-a:#3f9b76; --slab-human-b:#22664c; --slab-human-top:#7fd4ab;
    --slab-ink:#ffffff; --slab-sub:#e8f1f8; --slab-tool:#c6d9e8;
    --lbl-steel:#8ac6f2; --lbl-ochre:#f3c67e; --lbl-edge:#a9c0d4;
    --arr-steel:#9fd4fb; --arr-ochre:#f7cd8a; --arr-human:#93e0bb; --arr-neutral:#c2d4e4;
    --acc-leg:#6fb98f; --acc-mod:#6fb2e6; --acc-rap:#eab765; --acc-cat:#9a90e8; --acc-pack:#5fc4b6;
    --acc-find:#e0b155; --acc-reg:#e08b8b; --acc-modpanel:#f58ccb;
  }

  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.55;margin:0;padding:3rem 1.5rem 5rem}
  .wrap{max-width:80rem;margin:0 auto;display:flex;flex-direction:column;gap:2.25rem}

  .topline{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .stage-scroll{overflow-x:auto}
  .langpick{display:flex;gap:.25rem;position:absolute;top:.7rem;right:.85rem;z-index:2}
  .langpick button{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;
    cursor:pointer;background:var(--surface);color:var(--slate);
    border:1px solid var(--hairline);border-radius:6px;padding:.24rem .55rem;
    transition:background .15s ease,color .15s ease,border-color .15s ease}
  .langpick button:hover{color:var(--acc-mod);border-color:var(--acc-mod)}
  .langpick button.on{background:var(--acc-mod);border-color:var(--acc-mod);color:#fff}
  .langpick button:focus-visible{outline:2px solid var(--acc-mod);outline-offset:2px}

  .eyebrow{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.14em;
           text-transform:uppercase;color:var(--faint)}
  h1{font-size:2.15rem;font-weight:600;letter-spacing:-.022em;margin:.35rem 0 .6rem;text-wrap:balance}
  .lede{color:var(--slate);margin:0;max-width:36rem;font-weight:450}

  .stage-wrap{
    background:
      radial-gradient(120% 80% at 22% 6%, var(--stage-glow1) 0%, transparent 58%),
      radial-gradient(90% 70% at 88% 92%, var(--stage-glow2) 0%, transparent 62%),
      linear-gradient(168deg, var(--stage-1) 0%, var(--stage-2) 62%, var(--stage-3) 100%);
    border:1px solid var(--stage-edge); border-radius:14px;
    padding:1.5rem 1.1rem 1.1rem; position:relative;
    box-shadow:0 22px 48px -26px var(--stage-shadow), inset 0 1px 0 rgba(255,255,255,.35);}
  .stage-wrap svg text.n-title{fill:var(--slab-ink)}
  .stage-wrap svg text.n-sub{fill:var(--slab-sub)}
  .stage-wrap svg text.n-tool{fill:var(--slab-tool)}
  .stage-wrap svg text.edge-label{fill:var(--lbl-edge)}
  svg.flow{display:block;margin:0 auto;max-width:100%;height:auto}
  svg.flow text{font-family:var(--sans)}
  .n-title{font-size:12.5px;font-weight:600;fill:var(--ink)}
  .n-sub{font-size:10.5px;font-weight:500;fill:var(--slate)}
  .n-tool{font-size:9.5px;font-weight:500;font-family:var(--mono);fill:var(--faint)}
  .lane-label{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase}
  .edge-label{font-size:10px;font-weight:500;fill:var(--faint);font-family:var(--mono)}
  .hit{cursor:pointer}
  .hit:focus-visible{outline:2px solid var(--steel);outline-offset:3px}
  .node{transition:transform .2s ease}
  .hit{cursor:pointer;pointer-events:all}
  .hit:hover{transform:translate(0,-3px)}
  .hitarea{cursor:pointer}
  .lens{transition:opacity .18s ease}
  .hit:hover .lens circle:first-of-type{fill:rgba(255,255,255,.32)}

  .panel{--acc:var(--acc-leg);border:1px solid var(--hairline);border-radius:11px;
         padding:1.15rem 1.25rem;position:relative;overflow:hidden;
         background:linear-gradient(180deg,
           color-mix(in srgb, var(--acc) 9%, var(--sunk)) 0%, var(--sunk) 42%);
         box-shadow:0 10px 26px -18px var(--stage-shadow)}
  .panel::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
  .panel h2.sec{color:var(--acc);margin-bottom:.3rem}
  .panel-lede{margin:0 0 1rem;color:var(--slate);font-size:.88rem;font-weight:450;max-width:44rem}
  .panel .legend{border-top:1px solid var(--hairline)}
  #legpanel[data-collapsed="1"] .panel-lede,
  #legpanel[data-collapsed="1"] #legend{display:none}
  #legpanel[data-collapsed="1"] .zoom-head{margin-bottom:0}
  .panel .row{border-bottom-color:var(--hairline)}

  .zoom{border:1px solid var(--hairline);border-radius:11px;display:none;
        padding:1.15rem 1.25rem;position:relative;overflow:hidden;
        background:linear-gradient(180deg,
          color-mix(in srgb, var(--acc) 9%, var(--sunk)) 0%,
          var(--sunk) 42%);
        box-shadow:0 10px 26px -18px var(--stage-shadow)}
  .zoom::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
                background:var(--acc)}
  @keyframes arrive{
    0%   {box-shadow:0 0 0 0 color-mix(in srgb, var(--acc) 70%, transparent)}
    55%  {box-shadow:0 0 0 7px color-mix(in srgb, var(--acc) 0%, transparent)}
    100% {box-shadow:0 10px 26px -18px var(--stage-shadow)}
  }
  .zoom.arrive{animation:arrive 1.1s ease-out}
  .zoom.arrive::before{height:5px}
  @media (prefers-reduced-motion:reduce){.zoom.arrive{animation:none}}
  #zoom{--acc:var(--acc-modpanel)} #rappanel{--acc:var(--acc-rap)}
  #catpanel{--acc:var(--acc-cat)}
  #packpanel{--acc:var(--acc-pack)} #catpanel2{--acc:var(--acc-find)}
  #hwpanel{--acc:var(--acc-pack)}
  .catcard[data-open="hwpanel"]{--acc:var(--acc-pack)}
  #regpanel{--acc:var(--acc-reg)}
  .zoom-head h2{color:var(--acc)}
  .zoom .sub-h{color:var(--acc);opacity:.85}
  .zoom[data-open="1"]{display:block}
  .zoom-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
             flex-wrap:wrap;margin-bottom:.9rem}
  .zoom-head h2{font-size:1rem;font-weight:600;margin:0}
  .zoom-head p{margin:0;color:var(--slate);font-size:.86rem;font-weight:450;max-width:34rem}
  button.close{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;border:1px solid var(--hairline);color:var(--slate);
    padding:.3rem .6rem;border-radius:3px;cursor:pointer}
  button.close:hover{color:var(--acc);border-color:var(--acc)}

  .mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.6rem,1fr));gap:.45rem}
  .mod{background:var(--surface);border:1px solid var(--hairline);border-radius:9px;
       padding:.5rem .6rem;display:flex;flex-direction:column;gap:.15rem;
       border-left:3px solid var(--planned)}
  .mod[data-s="built"]{border-left-color:var(--built)}
  .mod[data-s="partial"]{border-left-color:var(--partial)}
  .mod{padding:.5rem .55rem;gap:.16rem}
  .mod .hd{font-size:.79rem;font-weight:600;line-height:1.25;color:var(--planned)}
  .mod[data-s="built"]   .hd{color:var(--built)}
  .mod[data-s="partial"] .hd{color:var(--partial)}
  .mod .pills{display:flex;gap:.25rem;flex-wrap:wrap;margin:.05rem 0 .1rem}
  .mod .pill{font-family:var(--mono);font-size:.58rem;font-weight:500;letter-spacing:.03em;
             border:1px solid var(--hairline);border-radius:3px;padding:.05rem .28rem;color:var(--slate)}
  .mod .pill.eng{border-style:dashed}
  .mod .pur{font-size:.715rem;font-weight:450;color:var(--slate);line-height:1.35;
            display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .mod .dep{font-size:.635rem;font-weight:500;color:var(--faint);font-family:var(--mono);
            line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mod.spine{border-left-color:var(--steel)}

  .mod{cursor:pointer;transition:background .16s ease,box-shadow .16s ease,opacity .16s ease}
  .mod:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
  .picking .mod{opacity:.38}
  .mod.hide{display:none}
  .mod.sel{opacity:1;background:var(--sel-fill);box-shadow:inset 0 0 0 1.5px var(--sel)}
  .mod.and{opacity:1;background:var(--and-fill);box-shadow:inset 0 0 0 1px var(--and)}
  .mod.or {opacity:1;background:var(--or-fill); box-shadow:inset 0 0 0 1px var(--or)}
  .mod .tag{font-family:var(--mono);font-size:.58rem;font-weight:500;letter-spacing:.04em;
            text-transform:uppercase;color:var(--faint);min-height:.85em}
  .mod.sel .tag{color:var(--sel)} .mod.and .tag{color:var(--and)} .mod.or .tag{color:var(--or)}

  .whywrap{display:flex;gap:1rem;align-items:flex-start;margin-top:.85rem}
  .shotbox{margin:0;flex:0 0 auto;width:8.5rem;cursor:pointer;display:flex;
           flex-direction:column;gap:.25rem}
  .shotbox img{width:100%;border:1px solid var(--hairline);border-radius:7px;background:#fff;
               box-shadow:0 6px 16px -10px var(--stage-shadow);transition:transform .16s ease}
  .shotbox:hover img{transform:translateY(-2px) scale(1.02)}
  .shotbox figcaption{font-family:var(--mono);font-size:.62rem;font-weight:500;
                      color:var(--acc);text-align:center}
  .whywrap .why-sel{margin:0;flex:1 1 auto;font-size:.88rem;font-weight:450;color:var(--slate);min-height:2.6em;
           border-left:2px solid var(--hairline);padding-left:.9rem}
  .why-sel b{color:var(--ink);font-weight:500}
  .swatches{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.6rem;
            font-family:var(--mono);font-size:.69rem;font-weight:500;color:var(--slate)}
  .sw{display:flex;align-items:center;gap:.35rem}
  .sw i{width:.8rem;height:.8rem;border-radius:2px;display:inline-block}

  .drow{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem;align-content:flex-start}
  .doc{font-family:var(--sans);font-size:.78rem;font-weight:500;cursor:pointer;
       background:var(--ochre-fill);border:1px solid var(--ochre-edge);color:var(--ink);
       border-radius:99px;padding:.3rem .8rem;transition:box-shadow .16s ease}
  .doc:hover{border-color:var(--ochre)}
  .doc.on{box-shadow:inset 0 0 0 2px var(--ochre);background:var(--ochre);color:#fff;
          border-color:var(--ochre)}
  .doc.src{box-shadow:inset 0 0 0 1px var(--ochre);opacity:.9}
  .doc .sfx{display:inline-block;min-width:3.1em;font-family:var(--mono);
            font-size:.67rem;font-weight:500;opacity:.85;text-align:right}
  .drow .doc:not(.on):not(.src){opacity:.55}
  .drow:not(:has(.on)) .doc{opacity:1}
  .doc:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  .sub-h{font-family:var(--mono);font-size:.69rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
         color:var(--faint);margin:0 0 .45rem}

  .packs{margin-top:1.1rem;border-top:1px solid var(--hairline);padding-top:.9rem}
  .prow{display:flex;flex-wrap:wrap;gap:.4rem}
  .pack{font-family:var(--mono);font-size:.73rem;font-weight:500;background:var(--surface);
        border:1px solid var(--hairline);border-radius:7px;padding:.25rem .55rem;color:var(--slate);
        transition:background .16s ease,box-shadow .16s ease,opacity .16s ease}
  .picking-p .pack{opacity:.35}
  .pack.on{opacity:1;background:var(--and-fill);box-shadow:inset 0 0 0 1px var(--and);color:var(--ink)}
  .pack b{color:var(--ink);font-weight:500}
  .pack em{font-style:normal;font-weight:500;color:var(--faint)}

  .catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem}
  .catcard{background:var(--surface);border:1px solid var(--hairline);border-radius:9px;
           padding:.75rem .85rem;display:flex;flex-direction:column;gap:.2rem;
           border-top:3px solid var(--acc)}
  .cnm{font-family:var(--mono);font-size:.76rem;font-weight:500;color:var(--ink)}
  .cnum{font-size:1.7rem;font-weight:600;line-height:1.1;color:var(--acc);
        font-variant-numeric:tabular-nums}
  .cwhat{font-size:.79rem;font-weight:450;color:var(--slate);line-height:1.45}


  /* ---- ondersteunde hardware -----------------------------------------
     Kaarten in plaats van een tabel: een tabel dwingt vijf kolommen op
     regels die heel verschillende lengtes hebben, en dan leest de smalste
     kolom als leeg. Alles hier komt uit de tokens van de pagina, zodat het
     donkere thema meekomt zonder tweede palet. */
  .hwsec{display:flex;align-items:baseline;gap:.5rem;margin:1rem 0 .45rem}
  .hwsec:first-of-type{margin-top:.2rem}
  .hwsec h3{font-family:var(--mono);font-size:.72rem;font-weight:500;
    letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:0}
  .hwsec .n{font-family:var(--mono);font-size:.68rem;color:var(--faint)}
  .hwsec .ln{flex:1;height:1px;background:var(--hairline)}
  .hwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));gap:.5rem}
  .hwcard{background:var(--surface);border:1px solid var(--hairline);border-radius:9px;
    padding:.6rem .7rem .55rem;display:flex;flex-direction:column;gap:.4rem}
  /* het merkblok: de naam in de eigen kleur van de leverancier. GEEN
     nagemaakt logo; dat zou onnauwkeurig zijn en andermans merk. */
  .hwmark{align-self:flex-start;display:inline-block;border-radius:5px;
    padding:.2rem .5rem;font-family:var(--mono);font-size:.68rem;font-weight:500;
    letter-spacing:.07em;text-transform:uppercase;line-height:1.25;white-space:nowrap}
  .hwprod{font-size:.83rem;font-weight:450;color:var(--ink);line-height:1.42}
  .hwmeta{display:flex;flex-wrap:wrap;gap:.3rem .55rem;align-items:center;

  leg:[
    ["down","Beforehand","Reads cluster name, nodes, management subnet and domain from the live cluster and prints them as the argument line for the intake. <code>Get-ClusterIntake.ps1</code>. It exists because a node name is not a field value but the address the collector connects to."],
    ["down","Intake","Recording scope and profile. <code>New-HealthCheckEngagement.ps1</code>"],
    ["down","The modules","Not a layer beside the process but a step inside it, magnifying into all fifteen. What is switched on here decides what gets measured and judged."],
    ["down","Measure","One collector per active module, at the customer, read only. The toolchain touches nothing; it gets files back."],
    ["down","Receipt","Every file classified by name and content into <code>incoming/</code>. <code>Receive-EngagementFile.ps1</code>"],
    ["down","Import","The planes come together into one run under <code>evidence/</code>. <code>Import-HealthCheckRun.ps1</code>"],
    ["down","Assess","The catalogue recipes run over that run and give a result per finding. <code>Compare-HealthCheckRuns.ps1</code>"],
    ["down","Register","Where the machine has no recipe, the assessor judges. That judgement is the register."],
    ["down","Write","Seven fields per finding: current situation, best practice, deviation, target, recommendation, action point and source. The gate is the machine-checkable part of that writing contract; the rest is judgement. Without this step there is a result but no report."],
    ["up","Render","Findings report, delta, remaining risk, trend, as-built and RCA. <code>documents/docengine</code>"],
    ["up","Delivery","The documents in <code>engagements/&lt;customer&gt;/out/</code>."],
    ["up","Remediate","Admins, partner and consultant resolve the findings. This is the only tread that sits <b>outside the toolchain</b>: nothing is measured and nothing is written here. The follow-up measurement then starts again at Measure, with the same register, and shows what has actually been resolved."]],
  aSvg:"U-shaped process diagram: intake at the top, down through the toolchain, delivery back up",
  pCat:"The yardstick everything is measured against. Without a recipe there is a measurement but no judgement.",
  cwMod:"modules, plus 7 joins and two separate code spaces. It states which modules exist, what they require and what they deliver into.",
  cwPack:"packs in 7 families: server, os, hba, switch, array, bmc, backup. What counts as normal for this model from this vendor.",
  cwFind:"entries with a valid scope, in three languages. Every entry is a recipe: the condition under which a finding fires and how heavily it weighs.",
  nCat:"<b>VerifiedOn</b> may be at most three months old. A module without a pack does measure, but delivers an observation instead of a judgement.",
  pPack:"36 packs in 7 families. <b>VerifiedOn</b> may be at most three months old; the lint fails on it.",
  pFind:"Version 0.50, 221 entries. Every entry is a recipe: what makes a finding fire, how heavily it weighs and where the evidence comes from.",
  pMod:"Two axes: the <b style='color:var(--ink);font-weight:500'>build state</b> comes from the register and holds everywhere, the <b style='color:var(--ink);font-weight:500'>engagement state</b> is per customer. The one below is an example.",
  pTypes:"Cluster types: <b style='color:var(--ink);font-weight:500'>Classic</b>, <b style='color:var(--ink);font-weight:500'>HCI</b>, <b style='color:var(--ink);font-weight:500'>Azure Local</b>, plus Standalone and ClusterSet. The storage axis decides how the array is reached, and therefore whether M1 or M2 takes part.",
  hPacks3:"The packs in the catalogue",
  pPacks3:"Seven families, 36 packs. A pack is the yardstick per vendor: what counts as normal for this model. Without a pack a module still measures, but has nothing to set the result against.",
  hJoins:"The seven joins",
  pJoins:"This is where modules genuinely touch. The dependencies form almost a tree under C1; the joins are the cross links, and they only run once every module named has delivered a measurement.",
  pReg:"Every finding with its risk, and whether a catalogue rule sits behind it. Three of the fourteen below hang off none at all; that is the difference that counts.",
  nReg:"In this demo estate <b>3 of the 34</b> findings hang off no catalogue rule at all. For those three no check ever runs: their absence from any result count is therefore not a clean bill of health but silence. Only the assessor can judge them.",
  pRap:"Six documents out of the same measurement. Click one to see which modules feed it, or the document icon for a sample page.",
  nWrite:"<strong>Writing is a step, not formatting.</strong> The register says whether something deviates; only the writing says what it means and what to do about it. That is why it stands as its own tread and not as part of rendering: the language is a choice at render time, the text is not.",
  nSubset:"<strong>The modules are a subset of the process.</strong> That is why they stand as a step in the chain, and why that one step magnifies into all fifteen modules with their dependencies. This is a zoom on this diagram and not a second diagram beside it: the same block, from closer up. What is switched on at intake decides which collectors go along, which planes come together at import and which recipes will have something to say later. A module that is off is not a missing box but a branch never entered.",
  nU:"<strong>Why the U shape says something.</strong> A straight chain suggests the journey stops at the last block. Here something comes back: the same findings that went down come up again as a judged document, and the follow-up measurement closes the loop at Measure and not at Intake. That is not a drawing choice but how it works: the scope is not established again, only measured again.",
  aLang:"Language", aNav:"Quick navigation", aTop:"Back to top", aClose:"Close",

    ["down","Aufnahme","Umfang und Profil festhalten. <code>New-HealthCheckEngagement.ps1</code>"],
    ["down","Die Module","Keine Schicht neben dem Prozess, sondern ein Schritt darin, vergrößerbar auf alle fünfzehn. Was hier eingeschaltet ist, bestimmt, was gemessen und beurteilt wird."],

    ["down","Eingang","Jede Datei nach Name und Inhalt klassifiziert nach <code>incoming/</code>. <code>Receive-EngagementFile.ps1</code>"],

    ["down","Schreiben","Sieben Felder je Befund: Ist-Zustand, Best Practice, Abweichung, Ziel, Empfehlung, Maßnahme und Quelle. Das Gate ist der maschinell prüfbare Teil dieses Schreibvertrags; der Rest ist Urteil. Ohne diesen Schritt gibt es zwar ein Ergebnis, aber keinen Bericht."],

    ["up","Beheben","Admins, Partner und Berater lösen die Befunde. Dies ist die einzige Stufe <b>außerhalb der Toolchain</b>: hier wird nichts gemessen und nichts geschrieben. Die Folgemessung beginnt danach wieder bei Messen, mit demselben Register, und zeigt, was tatsächlich behoben ist."]],

  pCat:"Der Maßstab, gegen den gemessen wird. Ohne Rezept gibt es zwar eine Messung, aber kein Urteil.",

  pMod:"Zwei Achsen: der <b style='color:var(--ink);font-weight:500'>Baustand</b> kommt aus dem Register und gilt überall, der <b style='color:var(--ink);font-weight:500'>Engagementstand</b> gilt je Kunde. Der unten ist ein Beispiel.",

  nReg:"In diesem Demo-Bestand hängen <b>3 von 34</b> Befunden an keiner einzigen Katalogregel. Für diese drei läuft nie eine Prüfung: ihr Fehlen in jeder Ergebniszählung ist deshalb kein sauberes Gesundheitszeugnis, sondern Stille. Nur der Assessor kann sie beurteilen.",

const cy = y => y + H/2;

const D = 10, E = 6;   // extrusiediepte en verticale verschuiving

function slab(g, x, y, w, h, tone, dashed){
  const R = 10;
  const s2 = el("g", {class:"slab"});
  // GEEN tweede plaat: de diepte komt uit de schaduw, plus een dunne rand
  // onderaan die dikte suggereert zonder een losse rechthoek te worden
  const f = el("rect",{x, y, width:w, height:h, rx:R, class:"card",
    fill:`url(#grad-${tone})`, stroke:`var(--slab-${tone}-top)`,
    "stroke-width":1.1, "stroke-opacity":.55});
  // klikbaar wordt aangegeven door het vergrootglas, niet door een stippellijn:
  // die botste met de vaste stijl van de andere blokken
  if (dashed) { f.setAttribute("stroke-opacity",".95"); f.setAttribute("stroke-width","1.8"); }
  s2.appendChild(f);
  // licht vangt de bovenrand EN de linkerflank
  s2.appendChild(el("path",{
    d:`M${x+1.6},${y+h-R} L${x+1.6},${y+R} Q${x+1.6},${y+1.8} ${x+R},${y+1.8} L${x+w-R},${y+1.8}`,
    stroke:"#ffffff","stroke-opacity":.34,"stroke-width":1.3,fill:"none",
    "stroke-linecap":"round"}));
  // schaduw valt op de onderrand EN de rechterflank
  s2.appendChild(el("path",{
    d:`M${x+R},${y+h-1.6} L${x+w-R},${y+h-1.6} Q${x+w-1.6},${y+h-1.6} ${x+w-1.6},${y+h-R} L${x+w-1.6},${y+R}`,
    stroke:"#000000","stroke-opacity":.26,"stroke-width":2,fill:"none",
    "stroke-linecap":"round"}));
  g.appendChild(s2);
  return s2;
}

// een haakse polyline met afgeronde hoeken
function bend(pts, r){
  if (pts.length < 3) return "M" + pts.map(p=>p.join(",")).join(" L");
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=1;i<pts.length-1;i++){
    const [px,py]=pts[i-1], [cx,cy]=pts[i], [nx,ny]=pts[i+1];
    const d1=Math.hypot(cx-px,cy-py), d2=Math.hypot(nx-cx,ny-cy);
    const k=Math.min(r, d1/2, d2/2);
    const a=[cx+(px-cx)/d1*k, cy+(py-cy)/d1*k];
    const b=[cx+(nx-cx)/d2*k, cy+(ny-cy)/d2*k];
    d += ` L${a[0]},${a[1]} Q${cx},${cy} ${b[0]},${b[1]}`;
  }
  const last=pts[pts.length-1];
  d += ` L${last[0]},${last[1]}`;
  return d;
}

// SVG kent geen tekstterugloop. Op een smallere trede wordt een te lange regel
// daarom iets samengeperst in plaats van buiten het blok door te lopen; dat
// meet de browser zelf, zodat het in alle drie de talen klopt.
function fit(t, max){
  if (!t.getComputedTextLength) return;
  const w = t.getComputedTextLength();
  if (w > max){ t.setAttribute("textLength", max); t.setAttribute("lengthAdjust","spacingAndGlyphs"); }
}
function card(g, x, y, d, tone, w){
  w = w || W;
  const box = el("g", {class: (d.zoom ? "hit " : "") + "node", tabindex: d.zoom ? "0" : null,
                       role: d.zoom ? "button" : null});
  const sl = slab(box, x, y, w, H, tone, !!d.zoom);
  sl.setAttribute("filter","url(#drop)");
  const t1 = el("text", {x:x+15, y:y+22, class:"n-title"}); t1.textContent = d.t;
  const t2 = el("text", {x:x+15, y:y+39, class:"n-sub"});   t2.textContent = d.s;
  const t3 = el("text", {x:x+15, y:y+54, class:"n-tool"});  t3.textContent = d.tool;
  box.append(t1,t2,t3);
  const room = w - 30 - (d.zoom ? 26 : 0);
  fit(t1, room); fit(t2, room); fit(t3, w - 30);
  if (d.zoom){
    const gz = el("g",{transform:`translate(${x+w-30},${y+H/2})`, class:"lens"});
    const tt = el("title"); tt.textContent = T().lensIn; gz.appendChild(tt);
    gz.appendChild(el("circle",{cx:0,cy:0,r:14, fill:"rgba(255,255,255,.14)",
      stroke:"#ffffff","stroke-opacity":.75, "stroke-width":1.2}));
    gz.appendChild(el("circle",{cx:-1.6,cy:-1.6,r:5.4, fill:"none",
      stroke:"#ffffff", "stroke-width":1.9}));
    gz.appendChild(el("path",{d:"M2.4,2.4 L7,7", stroke:"#ffffff",
      "stroke-width":2.2, "stroke-linecap":"round"}));
    const bar = el("path",{d:"M-4.2,-1.6 L0.9,-1.6", stroke:"#ffffff",
      "stroke-width":1.4, "stroke-linecap":"round"});
    const stem = el("path",{d:"M-1.6,-4.2 L-1.6,0.9", stroke:"#ffffff",
      "stroke-width":1.4, "stroke-linecap":"round", class:"lens-stem"});
    gz.append(bar, stem);
    const panelId = d.opens === "register" ? "regpanel"
                  : d.opens === "docs" ? "rappanel" : "zoom";
    const sync = () => {
      const z = document.getElementById(panelId);
      const isOpen = z.dataset.open === "1";
      stem.style.opacity = isOpen ? "0" : "1";
      const t = gz.querySelector("title");
      t.textContent = isOpen ? T().lensOut : T().lensIn;
      box.setAttribute("aria-expanded", isOpen ? "true" : "false");
    };
    LENSES.push(sync);
    // het blok opent altijd en springt erheen; alleen de lens schakelt
    const show = () => {
      const z = document.getElementById(panelId);
      z.dataset.open = "1";
      z.scrollIntoView({behavior:"smooth",block:"start"});
      flash(z);
      LENSES.forEach(fn=>fn());
    };
    const toggle = () => {
      const z = document.getElementById(panelId);
      if (z.dataset.open === "1"){
        z.dataset.open = "0";
        if (panelId === "zoom" || panelId === "rappanel"){
          current=null; clearMarks(); why.innerHTML = HINT();
          if (whyrap) whyrap.innerHTML = RHINT();
        }
        LENSES.forEach(fn=>fn());
        toStage();
      } else { show(); }
    };
    const open = show;
    gz.addEventListener("click", ev=>{ ev.stopPropagation(); toggle(); });
    const hitArea = el("rect",{x, y, width:W, height:H, rx:10,
      fill:"transparent", "pointer-events":"all", class:"hitarea"});
    box.appendChild(hitArea);
    box.appendChild(gz);
    box.addEventListener("click", open);
    box.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();open();} });
  }
  g.appendChild(box);
}

function path(g, d, tone, dashed, w){
  // een lichte halo eronder zodat de lijn ook op een donkere grond leest
  const glow = el("path", {d, fill:"none", stroke:"var(--stage-1)",
    "stroke-width": (w||1.8)+4, "stroke-opacity":.55, "stroke-linejoin":"round",
    "stroke-linecap":"round"});
  g.appendChild(glow);
  const p = el("path", {d, fill:"none", stroke:`var(--arr-${tone})`,
    "stroke-width": (w || 1.8) + 0.6, "stroke-linejoin":"round",
    "stroke-linecap":"round", "marker-end":"url(#a-"+tone+")"});
  if (dashed) p.setAttribute("stroke-dasharray","6 5");
  g.appendChild(p);
}

function clearMarks(){
  mods.classList.remove("picking");
  mods.querySelectorAll(".mod").forEach(n=>{

  });

  prow.classList.remove("picking-p");

}
function markPacks(ids){
  const fam = new Set(); ids.forEach(i=>(MODPACKS[i]||[]).forEach(f=>fam.add(f)));
  if (!fam.size) return;
  prow.classList.add("picking-p");
  fam.forEach(f=>{ const n=prow.querySelector(`.pack[data-f="${f}"]`); if(n) n.classList.add("on"); });
}
function mark(id, cls, tag){
  const n = mods.querySelector(`.mod[data-id="${id}"]`); if(!n) return;
  if (n.classList.contains("sel")) return;
  n.classList.add(cls); if(tag) n.querySelector(".tag").textContent = tag;
}

let current = null;
function pickModule(id){
  if (current === "m:"+id){ current=null; clearMarks(); why.innerHTML = HINT(); return; }
  current = "m:"+id;
  clearMarks(); mods.classList.add("picking");
  const m = byId[id];
  mark(id,"sel",P("gekozen"));

  m.req.forEach(r=>mark(r,"and",P("vereist")));
  MODS.filter(x=>x.req.includes(id)).forEach(x=>mark(x.id,"and",P("vereistDit")));

  const orGroups=[];
  m.any.forEach(g=>{ orGroups.push(g); g.forEach(o=>mark(o,"or",P("ofOf"))); });
  MODS.forEach(x=>x.any.forEach(g=>{ if(g.includes(id)) { orGroups.push(g); g.forEach(o=>mark(o,"or",P("ofOf"))); mark(x.id,"and",P("vereistDit")); }}));
  const viaChain=[];
  MODS.filter(x=>x.req.includes(id) && x.any.length).forEach(x=>{
    x.any.forEach(g=>{ viaChain.push([x,g]); g.forEach(o=>mark(o,"or",P("ofOf"))); });
  });

  const eaters = MODS.filter(x=>x.id!==id && (x.con.includes("*")||x.con.includes(id)));
  eaters.forEach(x=>mark(x.id,"and",P("leestDit")));
  const jn = JOINS.filter(([,r])=>r.includes(id));
  jn.forEach(([,r])=>r.forEach(o=>{ if(o!==id) mark(o,"and",P("join")); }));

  const bits=[];
  bits.push(`<b>${nameOf(id)}</b> ${P("is")} ${m.s}.`);
  if (m.req.length) bits.push(`${P("vereistZin")} ${m.req.map(nameOf).join(" "+P("en")+" ")}.`);
  orGroups.forEach(g=>bits.push(`${P("daarnaast")} <b>${g.map(nameOf).join(" "+P("of")+" ")}</b>: ${P("eenVanTwee")}`));
  viaChain.forEach(([x,g])=>bits.push(
    `${P("via")} <b>${x.id}</b>: ` + P("viaZin")
      .replace("%s", g.map(nameOf).join(" "+P("of")+" "))
      .replace("%m", x.id)));
  const needers = MODS.filter(x=>x.req.includes(id));
  if (needers.length) bits.push(`${needers.map(x=>x.id).join(", ")} ${P2("vereistDeze", needers.length!==1)} ${P("vereistStaart")}`);
  if (eaters.length) bits.push(`${eaters.map(x=>x.id+" ("+modNm(x)+")").join(" "+P("en")+" ")} ${P2("leestWat", eaters.length!==1)} ${P("leestStaart")}`);
  if (jn.length) bits.push(`${P("joins")} ${jn.map(([n])=>n).join(", ")}.`);
  markPacks([id]);
  const pk = MODPACKS[id];
  if (pk) bits.push(`${P("meetTegen")} ${pk.join(", ")}.`);
  else bits.push(P("geenPacks"));
  bits.push(`${P("levertAan")} ${m.to.map(t=>DOCS.filter(d=>d.tgt===t).map(d=>docName(d.id)).join(", ")).join(", ")}.`);
  why.innerHTML = bits.join(" ");
}

function setLang(code){

    // met textContent te bereiken, dus die volgt een stempel op de wortel

  document.querySelectorAll("#langpick button").forEach(b=>
    b.classList.toggle("on", b.dataset.l === code));

    const v = T()[el.dataset.i18n]; if (typeof v === "string") el.textContent = v;
  });
  // alinea's met een <b> of <strong> erin: die dragen opmaak, geen kale tekst
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const v = T()[el.dataset.i18nHtml]; if (typeof v === "string") el.innerHTML = v;
  });
  // en de teksten die alleen als attribuut bestaan, dus onzichtbaar bleven
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{
    const v = T()[el.dataset.i18nAria]; if (typeof v !== "string") return;
    el.setAttribute("aria-label", v);
    if (el.hasAttribute("title")) el.setAttribute("title", v);
  });
  build();                       // de tekening opnieuw, met nieuwe teksten
  renderMods(); renderDocs();

  ["hba", "QLogic (Marvell)",        "QLE2600 16G, QLE2700 32G, QLE2800 32/64G",              0, "host", "2026-07-17"]
];
const HWGROEP = {
  srv: ["Servers","Servers","Server"],
  oob: ["Out-of-band (BMC)","Out-of-band (BMC)","Out-of-Band (BMC)"],
  sw:  ["Switches","Switches","Switches"],
  arr: ["Storage arrays","Storage arrays","Storage-Arrays"],
  hba: ["HBA's","HBAs","HBAs"]
};
const HWHOE = {
  api:  ["API van het apparaat","device API","Geräte-API"],
  exp:  ["export van de switch","switch export","Switch-Export"],
  host: ["vanaf de host","from the host","von der Hostseite"],
  pack: ["alleen catalogus","catalogue only","nur Katalog"]
};
// De kleur is die van de leverancier zelf, met de tekstkleur die daarop
// leesbaar is. Dit is GEEN nagemaakt logo: een merkteken natekenen wordt
// onnauwkeurig en het is andermans merk. Een naam in de eigen kleur zegt
// hetzelfde zonder iets te vervalsen.
const HWMERK = {
  "Dell":                    ["#007db8","#ffffff"],
  "HPE":                     ["#01a982","#ffffff"],
  "HPE Aruba Networking":    ["#ff8300","#2a1400"],
  "Lenovo":                  ["#e1140a","#ffffff"],
  "Cisco":                   ["#1ba0d7","#ffffff"],
  "NVIDIA":                  ["#76b900","#12240a"],
  "Broadcom (Brocade)":      ["#cc092f","#ffffff"],
  "Pure Storage (Everpure)": ["#fe5000","#ffffff"],
  "IBM":                     ["#0f62fe","#ffffff"],
  "Emulex (Broadcom)":       ["#cc092f","#ffffff"],
  "QLogic (Marvell)":        ["#009edb","#ffffff"]
};
const hwwrap = document.getElementById("hwtbl");
function drawHw(){
  if (!hwwrap) return;
  hwwrap.innerHTML = "";
  ["srv","oob","sw","arr","hba"].forEach(g=>{
    const rijen = HWROWS.filter(r=>r[0]===g);
    if (!rijen.length) return;

    const kop = document.createElement("div");
    kop.className = "hwsec";
    const t = document.createElement("h3");
    t.textContent = HWGROEP[g][LIX()] || HWGROEP[g][0];
    const ln = document.createElement("span"); ln.className = "ln";
    const n = document.createElement("span"); n.className = "n"; n.textContent = rijen.length;
    kop.append(t, ln, n);
    hwwrap.appendChild(kop);

    const grid = document.createElement("div");
    grid.className = "hwgrid";
    rijen.forEach(([,ven,prod,mod,hoe,geijkt])=>{
      const k = document.createElement("div"); k.className = "hwcard";

      const merk = document.createElement("span");
      merk.className = "hwmark";
      const kl = HWMERK[ven] || ["#5d7086","#ffffff"];
      merk.style.background = kl[0]; merk.style.color = kl[1];
      merk.textContent = ven;

      const p = document.createElement("span");
      p.className = "hwprod"; p.textContent = prod;

      const meta = document.createElement("span"); meta.className = "hwmeta";
      const hb = document.createElement("span");
      hb.className = "hwhow" + (hoe === "api" ? " api" : "");
      hb.textContent = HWHOE[hoe][LIX()] || HWHOE[hoe][0];
      meta.appendChild(hb);
      if (mod){
        const m = document.createElement("span"); m.className = "hwmod";
        m.textContent = mod + " " + (T().hwMod || "models");
        meta.appendChild(m);
      }
      const d = document.createElement("span");
      d.textContent = geijkt;
      meta.appendChild(d);

      k.append(merk, p, meta);
      grid.appendChild(k);
    });
    hwwrap.appendChild(grid);
  });
}
drawHw();

const subjrow = document.getElementById("subjrow");
const SUBJ = {};
CATROWS.forEach(([,,sub])=>{ SUBJ[sub]=(SUBJ[sub]||0)+1; });
function drawCat(filter){
  cattbl.innerHTML="";
  tblRow(cattbl, T().thCat, "hd");
  CATROWS.filter(r=>!filter||r[2]===filter).forEach(([id,t,sub,risk])=>{
    tblRow(cattbl, [{t:id,c:"mono"}, catT(id,t), {t:sub,c:"mono"},
                    {t: risk ? (T().risk[risk] || risk) : "-", c:"badge risk-"+(risk||"")}]);
  });
}
let subjSel=null;
Object.entries(SUBJ).sort((a,b)=>b[1]-a[1]).forEach(([sub,n])=>{
  const b=document.createElement("button"); b.className="subj"; b.type="button";
  b.innerHTML=`${sub} <b>${n}</b>`;
  b.addEventListener("click", ()=>{
    subjSel = subjSel===sub ? null : sub;
    subjrow.querySelectorAll(".subj").forEach(x=>x.classList.remove("on"));
    if (subjSel) b.classList.add("on");
    drawCat(subjSel);
  });
  subjrow.appendChild(b);
});
drawCat(null);

// de taal pas zetten als alles bestaat: setLang tekent alles opnieuw
document.querySelectorAll("#langpick button").forEach(b=>
  b.addEventListener("click", ()=>setLang(b.dataset.l)));
// ENGELS IS DE STANDAARD (Hans, 5 sep 2026). Een ?lang= in de URL wint
// daarvan, zodat een link per taal te delen is: ?lang=nl, ?lang=en, ?lang=de.
// Alles anders valt terug op en; een onbekende waarde mag de pagina niet leeg
// laten en ook niet stil naar het Nederlands terugvallen.
(function(){
  var g = "en";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    if (q && ["nl","en","de"].indexOf(q.toLowerCase()) >= 0) g = q.toLowerCase();
  } catch (e) {}
  setLang(g);
})();
