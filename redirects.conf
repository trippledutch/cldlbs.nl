# CloudLabs · cldlbs.com · permanente omleidingen voor nginx
# ============================================================================
# Insluiten binnen het server-blok van cldlbs.com:
#
#     server {
#         server_name cldlbs.com;
#         include /pad/naar/redirects.conf;
#         ...
#     }
#
# Elke regel hieronder hoort bij een URL die tijdens de herbouw is verplaatst.
# Zonder deze regels eindigt een bestaande link, een bladwijzer of een verwijzing
# in een verstuurd document op een 404.
#
# 301 en niet 302: de verplaatsing is blijvend, en alleen bij een 301 draagt de
# oude URL zijn opgebouwde waarde over aan de nieuwe.

# ---- schone URL's in plaats van .html --------------------------------------
# De dienstbeschrijving van Hans linkt naar cldlbs.com/triage/ met een slash.
# Die vorm is leidend geworden; de .html-varianten wijzen ernaartoe.
location = /triage.html   { return 301 /triage/; }
location = /partners.html { return 301 /partners/; }
location = /blog.html     { return 301 /blog/; }
location = /findings.html { return 301 /rapport/; }
location = /faq.html      { return 301 /vragen/; }

# ---- vervangen pagina's -----------------------------------------------------
# cases.html is opgevolgd door /praktijkvoorbeelden/: dezelfde drie
# opdrachten, uitgewerkt tot eigen pagina's. De oude pagina noemt nog uurblokken
# (36 h, 72 h, 144 h) die niet meer bij het aanbod passen.
location = /cases.html { return 301 /praktijkvoorbeelden/; }

# Het overzicht stond eerst als los bestand in de wortel en is nu een map, net
# als de andere pagina's van de nieuwe stijl.
location = /praktijkvoorbeelden.html { return 301 /praktijkvoorbeelden/; }

# De vorige partnerpagina is bewaard onder partners-oud.html en staat op
# noindex. Zet hem hieronder als hij offline mag; zolang de regel uitstaat,
# blijft hij bereikbaar voor intern gebruik.
# location = /partners-oud.html { return 301 /partners/; }

# about.html is opgevolgd door /over-ons/. Deze is NIET hernoemd zoals
# partners.html: 33 pagina's linken ernaartoe en hij staat in de sitemap.
# Hernoemen zou die 33 links breken. Bij de overstap doet deze regel het werk,
# en gaan de interne links in dezelfde ronde mee naar /over-ons/.
location = /about.html { return 301 /over-ons/; }

# privacy.html is opgevolgd door /privacy/. De regel staat UIT, en met reden:
# privacy.html is tweetalig en is op dit moment de enige Engelse privacytekst
# die er is. /privacy/ is alleen Nederlands. Zet de regel aan zodra er een
# Engelse versie staat, of zodra de Engelse site sowieso van start gaat.
# location = /privacy.html { return 301 /privacy/; }

# ---- het vervallen uurtariefmodel -------------------------------------------
# engagement.html noemde 165 euro per uur en urenblokken van 9 tot 288 uur.
# Dat model is vervallen. De bedragen staan nu op /tarieven/ en de voorwaarden
# op /voorwaarden/, dat sinds september 2026 echte algemene voorwaarden zijn en
# niet meer de zes opdrachtvoorwaarden uit engagement.html.
# Beide oude pagina's wijzen naar de tarieven, want daar zocht de bezoeker naar.
location = /engagement.html { return 301 /tarieven/; }
location = /calculator.html { return 301 /tarieven/; }

# ---- de laatste oude pagina's -----------------------------------------------
# Deze vier verdwijnen zodra de nieuwe site live gaat. Zonder regel eindigt elke
# bestaande link, bladwijzer of zoekresultaat erop in een 404.

# book.html was het afspraakformulier; /afspraak/ is de opvolger.
location = /book.html     { return 301 /afspraak/; }

# method.html beschreef de werkwijze. Die staat nu uitgewerkt als de zes stappen
# tussen meting en rapport, op de HealthCheck-pagina.
location = /method.html   { return 301 /healthcheck/#doorloop; }

# services.html was het dienstenoverzicht met elf regels. Het aanbod staat nu
# als vertakking op de homepage en uitgewerkt op /healthcheck/.
location = /services.html { return 301 /healthcheck/; }

# index.html wordt vervangen door de nieuwe homepage. Zolang die nog
# preview-home.html heet is deze regel nodig; daarna neemt de nieuwe pagina
# gewoon de plek van / in en kan hij eruit.
# location = /preview-home.html { return 301 /; }

# ---- de foutpagina ----------------------------------------------------------
# Zonder deze regels toont nginx zijn eigen "404 Not Found": zwarte tekst op
# wit, zonder kopbalk, menu of weg terug. /404.html staat in de huisstijl en
# wijst door naar de tien pagina's waar de meeste bezoekers heen willen.
#
# De statuscode blijft 404. Dat is geen detail: geeft een foutpagina een 200
# terug, dan neemt Google aan dat het adres bestaat en houdt hij het in de
# index (een soft 404). error_page zonder = behoudt de oorspronkelijke code.
#
# internal betekent dat de pagina alleen intern mag worden aangeroepen. Vraagt
# iemand /404.html rechtstreeks op, dan geeft nginx een 404, en die 404 toont
# opnieuw deze pagina. Precies goed.

error_page 404 /404.html;
location = /404.html { internal; }

# De Engelse kant krijgt de Engelse foutpagina. Het blok is leeg op de
# error_page-regel na; de root, index en overige instellingen erven van het
# server-blok, dus /en/ blijft verder gewoon werken zoals hij deed.
location /en/ {
    error_page 404 /en/404.html;
}
location = /en/404.html { internal; }
