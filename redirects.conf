# engagement.html en calculator.html spreken het huidige aanbod tegen: het
# uurtarief-model is vervallen. Zodra besloten is waar die twee heen gaan,
# horen hier hun regels. Nu nog niet omleiden, want er staat geen vervanger.
# location = /engagement.html { return 301 /...; }
# location = /calculator.html { return 301 /...; }
