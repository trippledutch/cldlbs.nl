# CloudLabs · cldlbs.com · permanente omleidingen voor nginx
# ============================================================================
# Insluiten binnen het server-blok van cldlbs.com:
#
#     server {
#         server_name cldlbs.com;
#         include /pad/naar/redirects.conf;
#         ...
#     }
#
# Elke regel hieronder hoort bij een URL die tijdens de herbouw is verplaatst.
# Zonder deze regels eindigt een bestaande link, een bladwijzer of een verwijzing
# in een verstuurd document op een 404.
#
# 301 en niet 302: de verplaatsing is blijvend, en alleen bij een 301 draagt de
# oude URL zijn opgebouwde waarde over aan de nieuwe.

# ---- schone URL's in plaats van .html --------------------------------------
# De dienstbeschrijving van Hans linkt naar cldlbs.com/triage/ met een slash.
# Die vorm is leidend geworden; de .html-varianten wijzen ernaartoe.
location = /triage.html   { return 301 /triage/; }
location = /partners.html { return 301 /partners/; }
location = /blog.html     { return 301 /blog/; }
location = /findings.html { return 301 /rapport/; }

# ---- vervangen pagina's -----------------------------------------------------
# cases.html is opgevolgd door praktijkvoorbeelden.html: dezelfde drie
# opdrachten, uitgewerkt tot eigen pagina's. De oude pagina noemt nog uurblokken
# (36 h, 72 h, 144 h) die niet meer bij het aanbod passen.
location = /cases.html { return 301 /praktijkvoorbeelden.html; }

# De vorige partnerpagina is bewaard onder partners-oud.html en staat op
# noindex. Zet hem hieronder als hij offline mag; zolang de regel uitstaat,
# blijft hij bereikbaar voor intern gebruik.
# location = /partners-oud.html { return 301 /partners/; }

# about.html is opgevolgd door /over-ons/. Deze is NIET hernoemd zoals
# partners.html: 33 pagina's linken ernaartoe en hij staat in de sitemap.
# Hernoemen zou die 33 links breken. Bij de overstap doet deze regel het werk,
# en gaan de interne links in dezelfde ronde mee naar /over-ons/.
location = /about.html { return 301 /over-ons/; }

